services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: hn-api-ai
    ports:
      - "3000:3000"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s